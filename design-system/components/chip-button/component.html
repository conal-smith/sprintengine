<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chip button</title>
<link rel="stylesheet" href="../../foundations/tokens.css" />
<link rel="stylesheet" href="component.css" />
<style>
  body {
    margin: 0;
    font-family: var(--sem-font-family-ui);
  }
  .demo-stage {
    padding: var(--sem-space-3xl);
    background: var(--sem-color-bg-app);
    color: var(--sem-color-text-default);
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: var(--sem-space-md);
    flex-wrap: wrap;
    margin: 0 0 var(--sem-space-lg);
  }
  .demo-row:last-child {
    margin-bottom: 0;
  }
  .demo-label {
    font-size: var(--sem-font-size-meta);
    color: var(--sem-color-text-subtle);
    width: 100%;
  }
  .demo-panel {
    width: 260px;
    padding: var(--sem-space-sm);
    border: 1px solid var(--sem-color-border-subtle);
    border-radius: var(--sem-radius-shell);
    background: var(--sem-color-bg-surface);
  }
</style>
</head>
<body>
<div class="demo-stage" data-mode="light">
  <p class="demo-label">Light</p>
  <div class="demo-row">
    <span style="font-size: var(--sem-font-size-meta)">Grid <button type="button" class="ds-chip-button">100%</button> rides this line</span>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-chip-button" aria-pressed="false">List</button>
    <button type="button" class="ds-chip-button" aria-pressed="true">Grid</button>
    <button type="button" class="ds-chip-button ds-chip-button--outline">Plan</button>
    <button type="button" class="ds-chip-button ds-chip-button--outline" aria-current="true">Build</button>
    <button type="button" class="ds-chip-button ds-chip-button--overlay">Fit</button>
    <button type="button" class="ds-chip-button ds-chip-button--warn" aria-pressed="true">Bypass</button>
    <button type="button" class="ds-chip-button ds-chip-button--error" aria-pressed="true">Debug</button>
    <button type="button" class="ds-chip-button" disabled>Unavailable</button>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-chip-button ds-chip-button--raised">Model · high</button>
    <button type="button" class="ds-chip-button ds-chip-button--raised">Skills</button>
    <button type="button" class="ds-chip-button ds-chip-button--raised ds-chip-button--warn">Bypass</button>
    <button type="button" class="ds-chip-button ds-chip-button--raised" aria-label="More options">⋯</button>
    <button type="button" class="ds-chip-button ds-chip-button--raised" disabled>Unavailable</button>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-chip-button ds-chip-button--pill" aria-current="true">Installed</button>
    <button type="button" class="ds-chip-button ds-chip-button--pill">Studio</button>
    <button type="button" class="ds-chip-button ds-chip-button--pill">acme/skills</button>
    <button type="button" class="ds-chip-button ds-chip-button--pill">More</button>
  </div>
</div>
<div class="demo-stage" data-mode="dark">
  <p class="demo-label">Dark</p>
  <div class="demo-row">
    <span style="font-size: var(--sem-font-size-meta)">Grid <button type="button" class="ds-chip-button">100%</button> rides this line</span>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-chip-button" aria-pressed="false">List</button>
    <button type="button" class="ds-chip-button" aria-pressed="true">Grid</button>
    <button type="button" class="ds-chip-button ds-chip-button--outline">Plan</button>
    <button type="button" class="ds-chip-button ds-chip-button--outline" aria-current="true">Build</button>
    <button type="button" class="ds-chip-button ds-chip-button--overlay">Fit</button>
    <button type="button" class="ds-chip-button ds-chip-button--warn" aria-pressed="true">Bypass</button>
    <button type="button" class="ds-chip-button ds-chip-button--error" aria-pressed="true">Debug</button>
    <button type="button" class="ds-chip-button" disabled>Unavailable</button>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-chip-button ds-chip-button--raised">Model · high</button>
    <button type="button" class="ds-chip-button ds-chip-button--raised">Skills</button>
    <button type="button" class="ds-chip-button ds-chip-button--raised ds-chip-button--warn">Bypass</button>
    <button type="button" class="ds-chip-button ds-chip-button--raised" aria-label="More options">⋯</button>
    <button type="button" class="ds-chip-button ds-chip-button--raised" disabled>Unavailable</button>
  </div>
</div>
</body>
</html>
