<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Card scroller</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../card-button/component.css" />
    <link rel="stylesheet" href="component.css" />
  </head>
  <body>
    <section class="ds-card-scroller" aria-label="Things to try">
      <div class="ds-card-scroller-head"><span>Things to try</span></div>
      <div class="ds-card-scroller-row">
        <button class="ds-card-button" type="button">Check the docs against the code</button>
        <button class="ds-card-button" type="button">Find the untested paths</button>
        <button class="ds-card-button" type="button">Audit dependencies</button>
        <button class="ds-card-button" type="button">Triage the backlog</button>
      </div>
    </section>
  </body>
</html>
