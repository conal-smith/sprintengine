name: Release

# Main feeds a nightly train; stable is a promotion of what a nightly already
# shipped. docs/release-checklist.md walks through each entry point:
#
#   schedule                    every 30 minutes, a nightly of main's head, but
#                               only when the last nightly is 6+ hours old AND
#                               main has commits it did not ship
#                               (scripts/release/nightly-gate.mjs). A tick whose
#                               main is behind or diverged from the last
#                               nightly's commit (history rewritten) FAILS in
#                               the resolve step rather than skipping quietly.
#   dispatch nightly            a nightly of main's head now, gate skipped
#   dispatch stable             promote: rebuild the commit the latest nightly
#                               shipped, as stable X.Y.Z, and tag it -- so stable
#                               only ever ships a build nightly users have run
#   push a tag vX.Y.Z           stable build of exactly the tagged commit (hotfix)
#   dispatch preview            the one-off bridge that moves installs left on the
#                               retired preview train over to stable
#
# A merge to main publishes nothing; CI (ci.yml) gates it as before.
#
# Nightlies are vX.Y.Z-nightly.YYYYMMDD.RUN, where X.Y.Z is the version the next
# stable would take (Conventional Commits since the last stable tag), published
# as prereleases that are never marked latest, with nightly*.yml manifests.
#
# Build jobs publish NOTHING. They hand their files to one publish job, which
# merges the two macOS updater manifests, uploads everything to a draft and
# only then makes the release visible. When the packages were published by each
# build job on its own, the two macOS legs overwrote each other's
# latest-mac.yml, and a failed leg left a public half-release behind it.
on:
  push:
    tags:
      - "v*"
  schedule:
    # Minutes 7 and 37, off the top of the hour when scheduled runs queue
    # longest. Most ticks end in the resolve step, which decides in seconds that
    # the gate is shut; only a tick that passes it spends the packaging legs.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "nightly builds main now; stable promotes the commit the latest nightly shipped; preview is the one-off bridge for old preview installs"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
          - preview
      version:
        description: "stable only: publish as this X.Y.Z instead of the nightly's version (any version above the latest stable that no tag holds)"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish the release (false: build and keep the packages as workflow artifacts)"
        required: true
        default: true
        type: boolean

# Two queues. Nightlies share one so two ticks can never build the same commit
# or publish out of order; stable runs (promotions, tags, the bridge) share the
# other, so a queued nightly never holds up a promotion. Neither cancels: a
# cancelled release run can leave a draft or a tag behind, and every queued run
# is kept rather than replaced by the next one.
concurrency:
  group: desktop-release-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly')) && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  validate:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      ref: ${{ steps.resolve.outputs.ref }}
      previous_sha: ${{ steps.resolve.outputs.previous_sha }}
      source_private: ${{ steps.resolve.outputs.source_private }}
      mac_arm64_runner: ${{ steps.resolve.outputs.mac_arm64_runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Channel, version and commit for every later job. See the header for the
      # entry points; scripts/release/release.mjs for the rules. A shut gate
      # ends the run here, green, with should_build=false; a refusal (main
      # rewritten under the last nightly, a promotion that cannot ship) exits
      # non-zero and fails the run, so it is seen.
      - name: Resolve channel, version and commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_TOKEN: ${{ github.token }}
        run: node scripts/release/release.mjs resolve

  # The whole CI gate -- the build, verify:app, the marketplace registry -- against
  # the exact commit being released. It runs beside the packaging legs; only the
  # publish job waits for it, so it costs no wall-clock time.
  quality:
    name: Quality gate
    needs: validate
    if: needs.validate.outputs.should_build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}
      release_gate: true

  package:
    name: Package (${{ matrix.name }})
    needs: validate
    if: needs.validate.outputs.should_build == 'true'
    # The Apple Silicon leg runs on the self-hosted Mac while the source repo is
    # private (macOS minutes bill at 10x) and on a GitHub-hosted Mac once it is
    # public (free there, and a public repo must not use self-hosted runners).
    # validate decides; see SELF_HOSTED_MAC in scripts/release/release.mjs.
    runs-on: ${{ matrix.name == 'macos-arm64' && fromJSON(needs.validate.outputs.mac_arm64_runner) || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            runtimeArgs: --platform win32 --arch x64
            artifactName: sprintengine-windows
          - name: macos-x64
            os: macos-15-intel
            builderArgs: --mac --x64
            runtimeArgs: --platform darwin --arch x64
            artifactName: sprintengine-macos-x64
          # The self-hosted runner lives in ~/actions-runner on the INTERNAL
          # disk: macOS TCC refuses to exec a LaunchAgent from an external
          # volume ("Operation not permitted"), so do not relocate it to
          # /Volumes. Signing uses the CSC_* secrets, not the login keychain --
          # electron-builder imports the .p12 into a temporary keychain it
          # creates and destroys per build, which is what lets this work from a
          # LaunchAgent.
          - name: macos-arm64
            os: ""
            builderArgs: --mac --arm64
            runtimeArgs: --platform darwin --arch arm64
            artifactName: sprintengine-macos-arm64
          - name: linux
            os: ubuntu-latest
            runtimeArgs: --platform linux --arch x64
            artifactName: sprintengine-linux

    env:
      VERSION: ${{ needs.validate.outputs.version }}
      CHANNEL: ${{ needs.validate.outputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Before the build, not only at packaging: a nightly or promoted version is
      # not what package.json says at this commit, and the version must be the
      # same in the bundle, the app's own About box and the updater manifests.
      - name: Stamp the release version
        shell: bash
        run: npm pkg set "version=${VERSION}"

      # A nightly packages with the night-sky icon so it can be told from a
      # stable install in the Dock, the taskbar and the tray. The script copies
      # resources/icon-nightly.* over resources/icon.* in this throwaway
      # checkout, which every platform's build config and the tray already
      # read; stable leaves the committed icon alone.
      #
      # Guarded, because a promotion builds the commit the nightly shipped while
      # this workflow file comes from main: a step that calls a repository
      # script must survive a checkout from before that script existed, or the
      # first promotion after the script lands fails in every package job (it
      # did, 2026-09-22). The same rule applies to any step added here later.
      - name: Use the channel's app icon
        shell: bash
        run: |
          if [ -f scripts/release/use-channel-icons.mjs ]; then
            node scripts/release/use-channel-icons.mjs "${CHANNEL}"
          else
            echo "This commit predates the channel icon script; packaging with the committed icon."
          fi

      # `npm run dist:*` chains runtimes:fetch before the build; CI calls
      # electron-builder directly and so once skipped it entirely. resources/runtime
      # is gitignored, so every CI installer up to v0.3.0 shipped WITHOUT the
      # bundled npm that extraResources copies into the app.
      # electron-builder does not fail on a missing extraResources source; it
      # packages a green, silently incomplete app. Keep this ahead of the build.
      - name: Vendor the bundled npm runtime
        run: npm run runtimes:fetch -- ${{ matrix.runtimeArgs }}

      # The module SDK tarball "Build your own extension" copies into a new
      # project (resources/module-sdk, gitignored like resources/runtime): a
      # missing one packages green and scaffolds projects that cannot install.
      # Guarded like the icon step: a promotion may build a commit from before
      # the script existed.
      - name: Pack the module SDK the app ships
        shell: bash
        run: |
          if [ -f scripts/pack-module-sdk.mjs ]; then
            npm run sdk:bundle
          else
            echo "This commit predates the bundled module SDK; packaging without it."
          fi

      # Spotlight indexes each DMG the moment dmgbuild mounts it, and holds the
      # volume open, so the detach fails with `hdiutil: couldn't eject "diskN" -
      # Resource busy` -- after signing and notarisation have already passed.
      # Hosted runners only: never switch indexing off on the self-hosted Mac.
      - name: Stop Spotlight indexing (hosted macOS only)
        if: runner.os == 'macOS' && startsWith(runner.name, 'GitHub Actions')
        run: sudo mdutil -a -i off

      - name: Build renderer and main process
        run: npm run build

      # The Studio server a WSL distribution (phase 7) or an SSH machine
      # (phase 8) runs, shipped in every installer's resources. Guarded like
      # the icon step: a promotion may build a commit from before the script
      # could build it.
      - name: Build the server tree
        shell: bash
        run: |
          if grep -q -- "--wsl" scripts/build-server.mjs 2>/dev/null; then
            npm run build:server:wsl
          else
            echo "This commit predates the WSL server tree; packaging without it."
          fi

      # Packaging is split by platform ONLY so each platform's signing variables
      # reach no other runner. `getCscLink` in app-builder-lib resolves the
      # Windows certificate as `WIN_CSC_LINK ?? CSC_LINK`, so a CSC_LINK set on
      # every matrix job hands the Developer ID .p12 to the Windows job, which
      # then fails trying to Authenticode-sign with it.
      #
      # Every leg runs with --publish never: electron-builder still writes the
      # updater manifests (`<channel>*.yml`) beside the installers, and the
      # publish job uploads them all at once. publish.channel names those
      # manifests -- electron-builder does not derive it from the version.
      - name: Package app (macOS, signed and notarized)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npx electron-builder ${{ matrix.builderArgs }} --publish never "-c.publish.channel=${CHANNEL}"
          # Both macOS legs write <channel>-mac.yml, each listing only its own
          # arch. Rename the Intel one so the publish job can merge the two.
          if [ "${{ matrix.name }}" = "macos-x64" ]; then
            mv "dist/${CHANNEL}-mac.yml" "dist/${CHANNEL}-mac-x64.yml"
          fi
        env:
          # CSC_LINK is a "Developer ID Application" certificate exported as a
          # base64 .p12; APPLE_TEAM_ID is the team it was issued to. Check the
          # certificate's expiry in Apple's developer portal before a release.
          # The afterSign hook (scripts/release/notarize-mac.mjs, in place of
          # build.mac.notarize) notarizes with the APPLE_* trio and staples,
          # retrying a staple that loses its connection to Apple, so the CSC_*
          # pair and the APPLE_* trio are all load-bearing: a certificate
          # without notarisation credentials signs an app Gatekeeper refuses.
          # Never add WIN_CSC_* or AZURE_* here.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Azure Trusted Signing, which electron-builder drives itself (it installs
      # the TrustedSigning PowerShell module on first use) -- no certificate file,
      # no hardware token. All seven secrets sign; none leaves the installer
      # unsigned, as every release so far has been; a partial set is a
      # misconfiguration and fails rather than quietly shipping unsigned.
      - name: Package app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(--win --publish never "-c.publish.channel=${CHANNEL}")
          names=(AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TRUSTED_SIGNING_ENDPOINT
                 AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
                 AZURE_TRUSTED_SIGNING_PUBLISHER_NAME)
          present=0
          for name in "${names[@]}"; do [ -n "${!name}" ] && present=$((present + 1)); done
          if [ "$present" -eq "${#names[@]}" ]; then
            echo "Windows signing enabled (Azure Trusted Signing)."
            args+=(
              "-c.win.azureSignOptions.publisherName=${AZURE_TRUSTED_SIGNING_PUBLISHER_NAME}"
              "-c.win.azureSignOptions.endpoint=${AZURE_TRUSTED_SIGNING_ENDPOINT}"
              "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_TRUSTED_SIGNING_ACCOUNT_NAME}"
              "-c.win.azureSignOptions.certificateProfileName=${AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME}"
            )
          elif [ "$present" -eq 0 ]; then
            echo "Windows signing disabled: no Azure Trusted Signing secrets are set."
          else
            echo "Only ${present} of the ${#names[@]} Azure Trusted Signing secrets are set." >&2
            echo "Set all of them to sign, or none to ship unsigned." >&2
            exit 1
          fi
          npx electron-builder "${args[@]}"

      - name: Package app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: npx electron-builder --linux --publish never "-c.publish.channel=${CHANNEL}"

      # The packaged app.asar may only carry what main and preload load, within
      # a size budget: a renderer package listed under `dependencies` packages
      # green and adds its whole node_modules tree to every download (they
      # made up some 330 MB of each app.asar until 0.8.0). Nothing it unpacks
      # may also have bytes inside it. And the app may only carry the Chromium
      # locales build.electronLanguages keeps (all 55 were 49 MB of each Mac
      # app). Both checks run, so one failure does not hide the other. Guarded
      # like the icon step: a promotion may build a commit from before the
      # scripts existed.
      - name: Check what the packaged app ships
        shell: bash
        run: |
          status=0
          if [ -f scripts/release/check-app-asar.mjs ]; then
            node scripts/release/check-app-asar.mjs dist || status=1
          else
            echo "This commit predates the app.asar check; skipping it."
          fi
          if [ -f scripts/release/check-locales.mjs ]; then
            node scripts/release/check-locales.mjs dist || status=1
          else
            echo "This commit predates the locale check; skipping it."
          fi
          exit "$status"

      # Named files only: dist/ also holds builder-debug.yml and the unpacked
      # app, neither of which belongs on a release.
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactName }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/${{ needs.validate.outputs.channel }}*.yml

      # GitHub-hosted runners are discarded after a job; the self-hosted Mac is
      # not, and each Electron build leaves ~1GB in dist/. Without this the
      # runner's disk fills and later jobs fail for reasons that look unrelated.
      - name: Clean build output (self-hosted only)
        if: always() && !startsWith(runner.name, 'GitHub Actions')
        run: rm -rf dist out resources/runtime

  publish:
    name: Publish release
    needs: [validate, quality, package]
    if: needs.validate.outputs.should_build == 'true' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # To create the release, and the tag it sits on, in this repository.
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      REF: ${{ needs.validate.outputs.ref }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # For js-yaml only, so no install scripts (and no Electron download).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sprintengine-*-${{ needs.validate.outputs.version }}
          merge-multiple: true
          path: release-assets

      - name: Merge the macOS updater manifests
        run: node scripts/release/release.mjs merge-mac release-assets "${CHANNEL}"

      - name: Write release notes
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_TOKEN: ${{ github.token }}
          SOURCE_PRIVATE: ${{ needs.validate.outputs.source_private }}
          PREVIOUS_SHA: ${{ needs.validate.outputs.previous_sha }}
        run: node scripts/release/release.mjs notes release-notes.md

      # Draft first, every file uploaded, and only then visible. The updater and
      # the website read the release the moment it is published; a release
      # published before its last file finished uploading is one somebody can
      # half-install.
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          REPO="$(node -p "const p=require('./package.json').build.publish; p.owner + '/' + p.repo")"

          # --target does not move an existing tag. A retry must never publish
          # packages whose source differs from the tag the release advertises.
          if tagged_ref=$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null); then
            if [ "$tagged_ref" != "$REF" ]; then
              echo "${TAG} points at ${tagged_ref}, not the built commit ${REF}." >&2
              exit 1
            fi
          fi

          # A draft left by an earlier failed attempt of this same version.
          if gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "Removing the draft left by an earlier attempt."
            gh release delete "$TAG" --repo "$REPO" --yes
          fi

          # Only a stable is ever latest: every installed stable build resolves
          # its next version through /releases/latest.
          if [ "$CHANNEL" = "latest" ]; then
            flags=()
            latest="--latest"
          else
            flags=(--prerelease)
            latest="--latest=false"
          fi

          # --target: a tag that does not exist yet is created on the commit
          # that was built, not on whatever main has moved to since. For a
          # promotion that is the nightly's commit, which is how the stable tag
          # lands on it.
          gh release create "$TAG" --repo "$REPO" --target "$REF" --draft "${flags[@]}" \
            --title "SprintEngine Studio ${VERSION}" \
            --notes-file release-notes.md \
            release-assets/*
          gh release edit "$TAG" --repo "$REPO" --draft=false "$latest"

      # Twice over: once through the API with the job's token, which says the
      # release is complete, and once with no credential at all against the URLs
      # electron-updater reads, which says a user can actually get at it. Only
      # the second catches a releases repository that is private or misnamed --
      # the job's own token reads one of those perfectly well, which is how
      # builds up to 0.1.7 shipped pointing at a feed nobody could fetch.
      - name: Verify the published release, authenticated and not
        run: node scripts/release/release.mjs verify

      # Nightlies past the newest few are about 2 GB of installers each that
      # nothing reads: installed nightly builds, the nightly gate and a stable
      # promotion all go to the newest. Their tags stay. After the release is
      # verified, so the newest is the one just made; and a failure here leaves
      # the release it follows published, so it does not fail the job.
      - name: Delete the older nightly releases
        if: needs.validate.outputs.channel == 'nightly'
        continue-on-error: true
        run: node scripts/release/release.mjs prune-nightlies

      # A promoted stable has no tag in the source repo yet; a pushed one does.
      # `gh release create --target` above normally creates it already; this
      # stays as the guard. The workflow's own token does not trigger another run.
      - name: Tag the source commit
        if: needs.validate.outputs.channel == 'latest' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists on ${{ github.repository }}."
          else
            gh api "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${REF}"
          fi
