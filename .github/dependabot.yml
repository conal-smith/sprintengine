version: 2
updates:
  # Minor and patch updates arrive as one weekly pull request; a major version
  # arrives on its own, because each one is a migration to read, not a bump.
  - package-ecosystem: npm
    commit-message:
      prefix: "build"
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The xterm addons are pinned to one beta build together; they move as a
      # set, by hand, when the terminal is re-tested.
      - dependency-name: '@xterm/*'
  # The phone companion has its own package.json and lockfile. Expo pins its
  # React Native and expo-* versions to one SDK release, so their minor and
  # major versions move with an SDK upgrade, by hand; patches still come here.
  - package-ecosystem: npm
    commit-message:
      prefix: "build"
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # React Native carries its own renderer, built against one exact React:
      # even a React patch it was not built with stops the app at launch.
      - dependency-name: 'react'
      # The native modules and lint config the SDK names its own versions of
      # (`npx expo install --check`).
      - dependency-name: 'react-native-safe-area-context'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-screens'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-svg'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-webview'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'eslint-config-expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # typescript-eslint reads TypeScript's JavaScript API, which TypeScript 7
      # does not have; lint stays on 5.x until typescript-eslint supports 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    commit-message:
      prefix: "ci"
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
